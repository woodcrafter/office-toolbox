name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --windowed --name excel_image_inserter excel_image_inserter.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel_image_inserter-windows
          path: dist/excel_image_inserter.exe

      - name: Create Release with EXE
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: dist/excel_image_inserter.exe
