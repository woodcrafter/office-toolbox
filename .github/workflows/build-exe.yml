name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 中文路径在 Windows runner 的 bash 中会因编码问题失败，
      # 先用通配符（纯 ASCII）把源文件复制到 ASCII 目录再构建。
      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p ascii_build
          cp */excel_image_inserter.py */excel_cell_image_embedder.py */requirements.txt ascii_build/
          pip install -r ascii_build/requirements.txt

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          cd ascii_build
          pyinstaller --onefile --windowed --name excel_image_inserter excel_image_inserter.py
          pyinstaller --onefile --windowed --name excel_cell_image_embedder excel_cell_image_embedder.py
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/*.exe "$GITHUB_WORKSPACE/dist/"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel_image_inserter-windows
          path: dist/excel_image_inserter.exe

      - name: Upload embedder EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel_cell_image_embedder-windows
          path: dist/excel_cell_image_embedder.exe

      - name: Create Release with EXE
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            dist/excel_image_inserter.exe
            dist/excel_cell_image_embedder.exe
